<!doctype html>
<!-- PROTOTYPE - throwaway. Full-UI prototype of the redesign: fake playback, real library data when the server runs. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StemDeck prototype</title>
  <link rel="stylesheet" href="../mock.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/extras.css">
</head>
<body>
  <div class="mockbar" data-region="mockbar"></div>
  <div class="app">
    <header class="topbar" data-region="topbar"></header>
    <aside class="lib" data-region="sidebar"></aside>
    <main class="main-b" data-region="main"></main>
    <aside class="side" data-region="panel"></aside>
    <footer class="transport tb" data-region="footer"></footer>
    <div class="rz rz--lib" data-rz="lw" role="separator" aria-orientation="vertical" tabindex="0" title="Drag to resize the sidebar. Double-click to reset."></div>
    <div class="rz rz--head" data-rz="hw" role="separator" aria-orientation="vertical" tabindex="0" title="Drag to resize the stem controls. Double-click to reset."></div>
    <div class="rz rz--side" data-rz="sw" role="separator" aria-orientation="vertical" tabindex="0" title="Drag to resize the song tools. Double-click to reset."></div>
    <div class="layer" data-region="stage"></div>
    <div class="layer" data-region="browse"></div>
    <div class="layer" data-region="overlays"></div>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
